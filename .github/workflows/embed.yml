name: Otak Katalog Praktis

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      menit_panen:
        description: "Menit sejak mulai sampai panen outfit berhenti (default 75)"
        default: "75"

permissions:
  contents: write

concurrency:
  group: otak
  cancel-in-progress: false

jobs:
  otak:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache model CLIP
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-clip-vit-b32-v1

      - name: Pulihkan sidik jari (embedding)
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: emb-v2-${{ github.run_id }}
          restore-keys: emb-v2-

      - name: Pasang dependensi
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "numpy<2" "transformers>=4.40,<4.50" pillow requests

      - name: Jalankan otak (panen, mata, belajar, ekspor)
        env:
          MENIT_PANEN: ${{ github.event.inputs.menit_panen || '75' }}
          HF_HUB_DISABLE_TELEMETRY: "1"
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UNIVERSE_ID: "10753176264"
        shell: bash
        run: python otak.py 2>&1 | tee otak_log.txt

      # Kartu item (MATA v2): baca jenis/bentuk/tema/subjek/pola dari GAMBAR item (embedding yang baru dibuat otak.py).
      # Gagal di sini tidak menggagalkan putaran otak; server tetap memakai kartu versi sebelumnya.
      - name: Kartu item (baca gambar item)
        if: success()
        continue-on-error: true
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python kartu_item.py 2>&1 | tail -n 40

      - name: Simpan sidik jari ke cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: emb-v2-${{ github.run_id }}

      - name: Simpan hasil ke repo
        if: success()
        run: |
          tail -n 120 otak_log.txt > LOG_TERAKHIR.txt 2>/dev/null || echo "log tidak ada" > LOG_TERAKHIR.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in model bank meta data kartu/info.json kartu/kartu_0.json kartu/kartu_1.json kartu/kartu_2.json kartu/kartu_3.json kartu/kartu_4.json kartu/kartu_5.json kartu/kartu_6.json kartu/kartu_7.json LAPORAN_KARTU.md LAPORAN_OTAK.md LOG_TERAKHIR.txt; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan hasil."
          else
            git commit -m "Otak: panen + model kecocokan (putaran otomatis)"
            git pull --rebase origin main
            git push
          fi

      # Server Roblox mengunduh shard besar lewat CDN jsDelivr (gratis, tahan ribuan server). Cache cabang @main di CDN
      # dibersihkan supaya versi baru langsung terlihat (server tetap mengecek versi tiap shard & jatuh ke raw GitHub).
      - name: Segarkan cache CDN jsDelivr
        if: always()
        continue-on-error: true
        run: |
          for f in model/info.json model/item_{0..7}.json meta/harga_{0..7}.json bank/outfit_{0..3}.json meta/badan.json meta/sepatu.json kartu/info.json kartu/kartu_{0..7}.json; do
            curl -s -m 20 -o /dev/null -w "%{http_code} $f\n" "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/$f" || true
          done
