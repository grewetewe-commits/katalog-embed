name: Otak Katalog Praktis

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      menit_panen:
        description: "Menit sejak mulai sampai panen outfit berhenti (default 75)"
        default: "75"

permissions:
  contents: write

concurrency:
  group: otak
  cancel-in-progress: false

jobs:
  otak:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      # rev 33: hasil buatan (model/meta/bank/data/kartu/fisik3d) tinggal di cabang `data` (satu commit, ditimpa tiap putaran)
      - name: Ambil hasil terakhir dari cabang data
        run: |
          bash data_cabang.sh ambil otak model meta bank/outfit_0.json bank/outfit_1.json bank/outfit_2.json bank/outfit_3.json data/panen.json.gz out
          bash data_cabang.sh ambil ready bank/ready_outfits.json
          bash data_cabang.sh ambil mata3d fisik3d

      - name: Pasang Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache model CLIP
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-clip-vit-b32-v1

      - name: Pulihkan sidik jari (embedding)
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: emb-v2-${{ github.run_id }}
          restore-keys: emb-v2-

      - name: Pulihkan cache bentuk 2D
        uses: actions/cache/restore@v4
        with:
          path: cache_bentuk
          key: bentuk2d-v1-${{ github.run_id }}
          restore-keys: bentuk2d-v1-

      - name: Pasang dependensi
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "numpy<2" "transformers>=4.40,<4.50" pillow requests scipy scikit-learn

      - name: Jalankan otak (panen, mata, belajar, ekspor)
        env:
          MENIT_PANEN: ${{ github.event.inputs.menit_panen || '75' }}
          HF_HUB_DISABLE_TELEMETRY: "1"
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UNIVERSE_ID: "10753176264"
        shell: bash
        run: python otak.py 2>&1 | tee otak_log.txt

      # Kartu item (MATA v2): baca jenis/bentuk/tema/subjek/pola dari GAMBAR item (embedding yang baru dibuat otak.py).
      # Gagal di sini tidak menggagalkan putaran otak; server tetap memakai kartu versi sebelumnya.
      - name: Kartu item (baca gambar item)
        if: success()
        continue-on-error: true
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          BATAS_BENTUK: "12000"
          MENIT_BENTUK: "18"
        run: python kartu_item.py 2>&1 | tail -n 40

      - name: Simpan cache bentuk 2D
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache_bentuk
          key: bentuk2d-v1-${{ github.run_id }}

      - name: Simpan sidik jari ke cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: emb-v2-${{ github.run_id }}

      - name: Simpan hasil ke cabang data (satu commit, tidak menumpuk)
        if: success()
        run: |
          tail -n 120 otak_log.txt > LOG_TERAKHIR.txt 2>/dev/null || echo "log tidak ada" > LOG_TERAKHIR.txt
          shopt -s nullglob
          bash data_cabang.sh simpan otak "Otak: panen + model kecocokan (putaran otomatis)" model meta bank/outfit_*.json \
            data/panen.json.gz out kartu/info.json kartu/kartu_*.json kartu/tema_graf.json kartu/badan_bukti.json \
            LAPORAN_KARTU.md LAPORAN_OTAK.md LOG_TERAKHIR.txt

      - name: Bersihkan salinan lama di main (sekali setelah pindah ke cabang data)
        if: success() && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: bash data_cabang.sh bersihkan-main

      # Server Roblox mengunduh shard besar lewat CDN jsDelivr (gratis, tahan ribuan server). Cache cabang @data di CDN
      # dibersihkan supaya versi baru langsung terlihat (server tetap mengecek versi tiap shard & jatuh ke raw GitHub).
      - name: Segarkan cache CDN jsDelivr
        if: always()
        continue-on-error: true
        run: |
          bash data_cabang.sh segarkan model/info.json model/item_{0..7}.json meta/harga_{0..7}.json bank/outfit_{0..3}.json \
            meta/badan.json meta/sepatu.json kartu/info.json kartu/kartu_{0..7}.json kartu/tema_graf.json kartu/badan_bukti.json
