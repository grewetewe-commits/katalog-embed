name: Public ready outfit collection
on:
  workflow_dispatch:
  schedule:
    - cron: '41 */6 * * *'
permissions:
  contents: write
concurrency:
  group: ready-outfit-collection
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Ambil koleksi & kursor terakhir dari cabang data
        run: bash data_cabang.sh ambil ready bank/ready_outfits.json data/ready_outfit_cursor.json data/ready_outfit_report.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test_ready_outfits.mjs
      - run: node ready_outfits.mjs
      - name: Simpan koleksi & kursor ke cabang data (satu commit, tidak menumpuk)
        run: bash data_cabang.sh simpan ready "Refresh public ready outfit references" bank/ready_outfits.json data/ready_outfit_cursor.json data/ready_outfit_report.json
      - name: Bersihkan salinan lama di main (sekali setelah pindah ke cabang data)
        if: success() && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: bash data_cabang.sh bersihkan-main
      - name: Refresh public manifest CDN
        continue-on-error: true
        run: bash data_cabang.sh segarkan bank/ready_outfits.json
