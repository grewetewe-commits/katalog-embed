name: Radar UGC Gratis

# Terpisah dari otak: mencari UGC gratis yang hanya bisa diklaim di game lain (stok ada, sedang dijual),
# hasilnya radar.json di cabang `radar` (dibaca server Roblox Katalog Praktis). Tanpa kunci, tanpa biaya.
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: true

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pasang dependensi
        run: pip install requests

      - name: Jalankan radar
        run: python radar.py

      - name: Simpan ke cabang radar
        run: |
          mkdir -p /tmp/keluar
          cp radar.json LOG_RADAR.txt /tmp/keluar/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan radar-baru
          git rm -rf --quiet . || true
          cp /tmp/keluar/radar.json /tmp/keluar/LOG_RADAR.txt .
          git add radar.json LOG_RADAR.txt
          git commit -m "Radar UGC $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f origin HEAD:radar
