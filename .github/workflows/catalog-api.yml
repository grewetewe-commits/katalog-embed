name: Periksa API katalog
on:
  push:
    paths: ['services/catalog-api/**', '.github/workflows/catalog-api.yml']
  pull_request:
    paths: ['services/catalog-api/**', '.github/workflows/catalog-api.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/catalog-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/catalog-api/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
