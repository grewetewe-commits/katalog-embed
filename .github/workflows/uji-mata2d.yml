name: Uji mata 2D (baju/celana klasik)

# Eksperimen membaca pakaian 2D: banding varian di sampel tetap, hasil untuk label emas manual. Tidak menyentuh main.
on:
  push:
    branches: [claude/kartu-item]
    paths: [uji_mata2d.py, .github/workflows/uji-mata2d.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uji-mata2d
  cancel-in-progress: true

jobs:
  uji:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pulihkan model CLIP B/32 (cache main)
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface
          key: hf-clip-vit-b32-v1
      - name: Pulihkan sidik jari gambar (cache main, hanya baca)
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: emb-v2-uji2d-${{ github.run_id }}
          restore-keys: emb-v2-
      - name: Ambil data panen terbaru dari main
        run: |
          git fetch --depth 1 origin main
          git checkout origin/main -- data/panen.json.gz model
      - name: Pasang dependensi
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "numpy<2" "transformers>=4.40,<4.50" pillow requests
      - name: Uji varian
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python uji_mata2d.py 2>&1 | tee uji2d_log.txt
      - name: Simpan hasil ke branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset -q -- data model
          git checkout -- data model 2>/dev/null || true
          mkdir -p uji2d && tail -n 80 uji2d_log.txt > uji2d/LOG.txt
          git add uji2d
          git commit -m "Uji mata 2D: hasil varian (otomatis)" || echo "tidak ada perubahan"
          git pull --rebase -q origin claude/kartu-item || true
          git push origin HEAD:claude/kartu-item
